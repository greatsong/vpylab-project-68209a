    // 축 & 그리드
    if(cmd.show_axes!==false){
      const gs=10,gd=20;
      const grid=new THREE.GridHelper(gs,gd,0x444466,0x333355); grid.material.opacity=0.15; grid.material.transparent=true; tagChart(grid); scene.add(grid);
      const al=gs/2;
      [[1,0,0,0.9,0.2,0.2],[0,1,0,0.2,0.9,0.2],[0,0,1,0.2,0.2,0.9]].forEach(([dx,dy,dz,r,g,b])=>{
        const pts=[new THREE.Vector3(0,0,0),new THREE.Vector3(dx*al,dy*al,dz*al)];
        const geo=new THREE.BufferGeometry().setFromPoints(pts);
        const mat=new THREE.LineBasicMaterial({color:new THREE.Color(r,g,b),transparent:true,opacity:0.6});
        const line=new THREE.Line(geo,mat); tagChart(line); scene.add(line);
      });
    }
  }

  // === 브릿지: JSON 커맨드 → Three.js ===
  const meshes = new Map();
  const trails = new Map();
  const curves = new Map();   // curve/points 동적 라인
  function toColor(arr) { return new THREE.Color(arr[0], arr[1], arr[2]); }

  // box를 axis/up 기준으로 회전 (Gram-Schmidt 직교화 — 메인 엔진과 동일)
  function applyBoxOrientation(mesh) {
    const axis = mesh.userData.boxAxis || [1,0,0];
    const up = mesh.userData.boxUp || [0,1,0];
    const xAxis = new THREE.Vector3(...axis);
    if (xAxis.lengthSq() < 1e-12) xAxis.set(1,0,0); else xAxis.normalize();
    const yAxis = new THREE.Vector3(...up);
    if (yAxis.lengthSq() < 1e-12) yAxis.set(0,1,0);
    yAxis.addScaledVector(xAxis, -yAxis.dot(xAxis));
    if (yAxis.lengthSq() < 1e-12) {
      if (Math.abs(xAxis.y) < 0.9) yAxis.set(0,1,0); else yAxis.set(0,0,1);
      yAxis.addScaledVector(xAxis, -yAxis.dot(xAxis));
    }
    yAxis.normalize();
    const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis).normalize();
    yAxis.crossVectors(zAxis, xAxis).normalize();
    mesh.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(xAxis, yAxis, zAxis));
  }

  // arrow 그룹 길이/굵기 재구성 (VPython: |axis| = 길이)
  function rebuildArrow(group, len, sw) {
    const [shaft, head] = group.children;
    if (shaft?.geometry) { shaft.geometry.dispose(); shaft.geometry = new THREE.CylinderGeometry(sw/2, sw/2, len*0.8, 8); shaft.position.y = len*0.4; }
    if (head?.geometry) { head.geometry.dispose(); head.geometry = new THREE.ConeGeometry(sw*1.5, len*0.2, 8); head.position.y = len*0.9; }
  }

  // helix 길이 재구성 (radius/coils는 생성 시 값 유지)
  function rebuildHelixLen(line, len) {
    const r = line.userData.helixRadius || 1; const coils = line.userData.helixCoils || 5;
    const seg = Math.max(64, coils*32); const positions = [];
    for (let i=0;i<=seg;i++){const t=i/seg;const ang=t*coils*Math.PI*2;positions.push(t*len, r*Math.cos(ang), r*Math.sin(ang));}
    line.geometry.dispose();
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.computeBoundingSphere();
    line.geometry = g;
  }

  function createTrail(cmd) {
    const trailColor = cmd.trail_color ? toColor(cmd.trail_color) : toColor(cmd.color || [1,1,1]);
    const trailMat = new THREE.LineBasicMaterial({ color: trailColor });
    const trailGeo = new THREE.BufferGeometry();
    const positions = [];
    if (cmd.pos) positions.push(cmd.pos[0], cmd.pos[1], cmd.pos[2]);
    trailGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    const trailLine = new THREE.Line(trailGeo, trailMat);
    scene.add(trailLine);
    trails.set(cmd.id, { line: trailLine, positions, maxPoints: 10000 });
  }

  function updateTrail(cmd) {
    const trail = trails.get(cmd.id);
    if (!trail) return;
    trail.positions.push(cmd.pos[0], cmd.pos[1], cmd.pos[2]);
    if (trail.positions.length > trail.maxPoints * 3) trail.positions.splice(0, 3);
    trail.line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(trail.positions, 3));
    trail.line.geometry.computeBoundingSphere();
  }

  function cloneColor(color) {
    return typeof color?.clone === 'function'
      ? color.clone()
      : new THREE.Color(color?.r ?? 0, color?.g ?? 0, color?.b ?? 0);
  }

  function setMaterialEmissive(material, enabled) {
    if (!material || !('emissive' in material)) return;
    material.emissive = enabled ? cloneColor(material.color) : new THREE.Color(0, 0, 0);
    material.emissiveIntensity = enabled ? 0.8 : 0;
    material.needsUpdate = true;
  }

  function updateMaterialColor(material, color) {
    if (!material) return;
    material.color = color;
    if ('emissiveIntensity' in material && material.emissiveIntensity > 0) {
      material.emissive = cloneColor(color);
    }
  }

  function processCmd(cmd) {
    if (cmd.action === 'create') {
      let mesh;
      const baseColor = toColor(cmd.color || [1,1,1]);
      const mat = new THREE.MeshStandardMaterial({
        color: baseColor, roughness: cmd.shininess === undefined ? 0.4 : Math.max(0.05,1-cmd.shininess), metalness: 0.1,
        emissive: cmd.emissive ? cloneColor(baseColor) : new THREE.Color(0,0,0),
        emissiveIntensity: cmd.emissive ? 0.8 : 0,
        transparent: (cmd.opacity ?? 1) < 1, opacity: cmd.opacity ?? 1,
      });
      switch (cmd.type) {
        case 'sphere': mesh = new THREE.Mesh(new THREE.SphereGeometry(cmd.radius || 1, 32, 16), mat); break;
        case 'box': { const s = cmd.size || [cmd.length||1, cmd.height||1, cmd.width||1]; mesh = new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[2]), mat); break; }
        case 'cylinder': {
          const r = cmd.radius||1; const a = cmd.axis||[1,0,0]; const l = Math.hypot(...a)||1;
          mesh = new THREE.Mesh(primitiveGeometry.cylinder(r,l), mat);
          const dir = new THREE.Vector3(...a).normalize();
          mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
          break;
        }
        case 'arrow': {
          const a = cmd.axis||[1,0,0]; const l = Math.hypot(...a)||1; const sw = cmd.shaftwidth||0.1;
          const group = new THREE.Group();
          const shaft = new THREE.Mesh(new THREE.CylinderGeometry(sw/2,sw/2,l*0.8,8), mat);
          shaft.position.y = l*0.4; group.add(shaft);
          const head = new THREE.Mesh(new THREE.ConeGeometry(sw*1.5,l*0.2,8), mat);
          head.position.y = l*0.9; group.add(head);
          const dir = new THREE.Vector3(...a).normalize();
          group.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
          mesh = group; break;
        }
        case 'cone': {
          const r = cmd.radius||1; const a = cmd.axis||[1,0,0]; const l = Math.hypot(...a)||1;
          mesh = new THREE.Mesh(primitiveGeometry.cone(r,l), mat);
          const dir = new THREE.Vector3(...a).normalize();
          mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
          break;
        }
        case 'ring': mesh = new THREE.Mesh(new THREE.TorusGeometry(cmd.radius||1, cmd.thickness||0.1, 16, 48), mat); mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1), new THREE.Vector3(...(cmd.axis||[1,0,0])).normalize()); break;
        case 'pyramid': {
          mesh = new THREE.Mesh(primitiveGeometry.pyramid(cmd.size || [1,1,1]), mat);
          break;
        }
        case 'ellipsoid': {
          const sz = cmd.size || [1,1,1];
          mesh = new THREE.Mesh(new THREE.SphereGeometry(0.5, 32, 16), mat);
          mesh.scale.set(sz[0], sz[1], sz[2]);
          break;
        }
        case 'helix': {
          const r = cmd.radius||1; const a = cmd.axis||[1,0,0]; const len = cmd.length ?? 1;
          const coils = cmd.coils||5; const seg = Math.max(64, coils*32);
          const positions = [];
          for (let i=0;i<=seg;i++){const t=i/seg;const ang=t*coils*Math.PI*2;positions.push(t*len, r*Math.cos(ang), r*Math.sin(ang));}
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
          mesh = new THREE.Line(g, new THREE.LineBasicMaterial({color: baseColor, transparent:(cmd.opacity??1)<1, opacity:cmd.opacity??1}));
          mesh.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0), new THREE.Vector3(...a).normalize());
          break;
        }
        case 'label': {
          // 캔버스 텍스처 → Sprite (항상 카메라를 향함)
          const text = String(cmd.text||''); const fontPx = cmd.height||16;
          const measure = document.createElement('canvas').getContext('2d');
          measure.font = (fontPx*2) + 'px sans-serif';
          const tw = Math.max(32, Math.ceil(measure.measureText(text||' ').width)+12);
          const th = Math.max(32, Math.ceil(fontPx*2*1.4)+12);
          const cv = document.createElement('canvas'); cv.width=tw; cv.height=th;
          const ctx = cv.getContext('2d');
          if (cmd.background) { const c=cmd.background; ctx.fillStyle = 'rgba('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+',0.85)'; ctx.fillRect(0,0,tw,th); }
          const c = cmd.color||[1,1,1];
          ctx.fillStyle = 'rgb('+Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255)+')';
          ctx.font = (fontPx*2) + 'px sans-serif';
          ctx.textBaseline='middle'; ctx.textAlign='center';
          ctx.fillText(text, tw/2, th/2);
          const tex = new THREE.CanvasTexture(cv);
          const sm = new THREE.SpriteMaterial({map:tex, transparent:true, opacity:cmd.opacity??1, depthTest:false, depthWrite:false});
          mesh = new THREE.Sprite(sm);
          const ws = fontPx/32;
          mesh.scale.set((tw/th)*ws, ws, 1);
          break;
        }
        case 'curve': {
          const pts = (cmd.points||[]).flat();
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
          mesh = new THREE.Line(g, new THREE.LineBasicMaterial({color: baseColor, transparent:(cmd.opacity??1)<1, opacity:cmd.opacity??1}));
          curves.set(cmd.id, {line: mesh, positions: pts.slice()});
          break;
        }
        case 'points': {
          const pts = (cmd.points||[]).flat();
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(pts,3));
          mesh = new THREE.Points(g, new THREE.PointsMaterial({color: baseColor, size:(cmd.size??5)*0.02, sizeAttenuation:true, transparent:(cmd.opacity??1)<1, opacity:cmd.opacity??1}));
          curves.set(cmd.id, {line: mesh, positions: pts.slice()});
          break;
        }
        case 'triangle':
        case 'quad': {
          const verts = cmd.vertices || [];
          const positions = []; const colors = [];
          const indices = cmd.type === 'triangle' ? [0,1,2] : [0,1,2,0,2,3];
          for (const i of indices) {
            const v = verts[i] || {pos:[0,0,0], color:[1,1,1]};
            positions.push(v.pos[0], v.pos[1], v.pos[2]);
            colors.push(v.color[0], v.color[1], v.color[2]);
          }
          const g = new THREE.BufferGeometry();
          g.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
          g.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
          g.computeVertexNormals();
          mesh = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, side:THREE.DoubleSide, roughness:0.5, metalness:0.05}));
          break;
        }
        case 'extrusion': {
          const path = cmd.path || []; const shape = cmd.shape || [];
          if (path.length >= 2 && shape.length >= 3) {
            const sh = new THREE.Shape();
            sh.moveTo(shape[0][0], shape[0][1]);
            for (let i=1;i<shape.length;i++) sh.lineTo(shape[i][0], shape[i][1]);
            sh.closePath();
            const cv = new THREE.CatmullRomCurve3(path.map(p => new THREE.Vector3(p[0], p[1], p[2]??0)));
            mesh = new THREE.Mesh(new THREE.ExtrudeGeometry(sh, {steps: Math.max(path.length*4,12), extrudePath: cv}), mat);
          } else {
            mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), mat);
          }
          break;
        }
        case 'local_light': {
          const lt = new THREE.PointLight(toColor(cmd.color||[1,1,1]), cmd.intensity??1, 50);
          if(cmd.pos) lt.position.set(...cmd.pos); scene.add(lt); meshes.set(cmd.id, lt); return;
        }
        case 'distant_light': {
          const lt = new THREE.DirectionalLight(toColor(cmd.color||[1,1,1]), cmd.intensity??1);
          const d=cmd.direction||[0,-1,0]; lt.position.set(-d[0]*10,-d[1]*10,-d[2]*10);
          scene.add(lt); meshes.set(cmd.id, lt); return;
        }
        default: return;
      }
      if (cmd.pos) mesh.position.set(cmd.pos[0], cmd.pos[1], cmd.pos[2]);
      mesh.visible = cmd.visible !== false;
      mesh.userData = Object.assign(mesh.userData || {}, { vpType: cmd.type });
      if (cmd.type === 'arrow') { const a0 = cmd.axis || [1,0,0]; mesh.userData.arrowLen = Math.hypot(...a0) || 1; mesh.userData.shaftwidth = cmd.shaftwidth || 0.1; }
      if (cmd.type === 'helix') { mesh.userData.helixRadius = cmd.radius || 1; mesh.userData.helixCoils = cmd.coils || 5; }
      if (['box','pyramid','ellipsoid'].includes(cmd.type) && (cmd.axis || cmd.up)) { mesh.userData.boxAxis = cmd.axis || [1,0,0]; mesh.userData.boxUp = cmd.up || [0,1,0]; applyBoxOrientation(mesh); }
      scene.add(mesh);
      meshes.set(cmd.id, mesh);
      if (cmd.make_trail) createTrail(cmd);
    } else if (cmd.action === 'update') {
      const m = meshes.get(cmd.id); if (!m) return;
      if (cmd.pos) m.position.set(cmd.pos[0], cmd.pos[1], cmd.pos[2]);
      if (cmd.color) {
        if (m.isLight) m.color = toColor(cmd.color);
        else if (m.userData?.vpType === 'compound') compoundAppearance.apply(m, {color:cmd.color});
        else if (m.isGroup) m.traverse(c => { if(c.material) updateMaterialColor(c.material, toColor(cmd.color)); });
        else if (m.material) updateMaterialColor(m.material, toColor(cmd.color));
      }
      if (cmd.intensity !== undefined && m.isLight) m.intensity = cmd.intensity;
      if (cmd.direction !== undefined && m.isDirectionalLight) m.position.set(-cmd.direction[0]*10,-cmd.direction[1]*10,-cmd.direction[2]*10);
      if (cmd.visible !== undefined) m.visible = cmd.visible;
      if (cmd.opacity !== undefined) {
        if(m.userData?.vpType==='compound') compoundAppearance.apply(m,{opacity:cmd.opacity});
        else if (m.isGroup) m.traverse(c => { if(c.material)compoundAppearance.setOpacity(c.material,cmd.opacity); });
        else if (m.material) compoundAppearance.setOpacity(m.material,cmd.opacity);
      }
      if(cmd.shininess!==undefined && m.userData?.vpType==='compound')compoundAppearance.apply(m,{shininess:cmd.shininess});
      if (cmd.emissive !== undefined && !m.isLight) {
        if(m.userData?.vpType==='compound') compoundAppearance.apply(m,{emissive:cmd.emissive});
        else if (m.isGroup) m.traverse(c => { if(c.material) setMaterialEmissive(c.material, cmd.emissive); });
        else if (m.material) setMaterialEmissive(m.material, cmd.emissive);
      }
      if (cmd.radius !== undefined && m.geometry) {
        let ng;
        if(m.geometry.type==='SphereGeometry') ng=new THREE.SphereGeometry(cmd.radius,32,16);
        else if(m.geometry.type==='ConeGeometry'&&m.userData?.vpType!=='pyramid') ng=primitiveGeometry.cone(cmd.radius,m.geometry.parameters?.height||1);
        else if(m.geometry.type==='CylinderGeometry') ng=primitiveGeometry.cylinder(cmd.radius,m.geometry.parameters?.height||1);
        else if(m.geometry.type==='TorusGeometry') ng=new THREE.TorusGeometry(cmd.radius,m.geometry.parameters?.tube||0.1,16,48);
        if(ng){m.geometry.dispose();m.geometry=ng;}
      }
      if (cmd.size !== undefined && m.geometry) {
        const s=cmd.size;
        if(m.userData?.vpType==='pyramid'){m.geometry.dispose();m.geometry=primitiveGeometry.pyramid(s);}
        else if (m.geometry.type==='SphereGeometry') { m.scale.set(s[0],s[1],s[2]); } // ellipsoid: sphere+scale — 상자로 바꾸지 않음
        else { const ng=new THREE.BoxGeometry(s[0],s[1],s[2]); m.geometry.dispose(); m.geometry=ng; }
      }
      if (cmd.thickness !== undefined && m.geometry?.type==='TorusGeometry') { const r=m.geometry.parameters?.radius||1; const ng=new THREE.TorusGeometry(r,cmd.thickness,16,48); m.geometry.dispose(); m.geometry=ng; }
      if (cmd.axis !== undefined || cmd.up !== undefined) {
        const vpType = m.userData?.vpType;
        if (['box','pyramid','ellipsoid','compound'].includes(vpType)) {
          if (cmd.axis) m.userData.boxAxis = cmd.axis;
          if (cmd.up) m.userData.boxUp = cmd.up;
          applyBoxOrientation(m);
        } else if (cmd.axis !== undefined) {
          const len = Math.hypot(...cmd.axis) || 1;
          const dir = new THREE.Vector3(...cmd.axis).normalize();
          if (vpType === 'cylinder' && m.geometry) { const r=m.geometry.parameters?.radiusTop??1; m.geometry.dispose(); m.geometry=primitiveGeometry.cylinder(r,len); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
          else if (vpType === 'cone' && m.geometry) { const r=m.geometry.parameters?.radius??1; m.geometry.dispose(); m.geometry=primitiveGeometry.cone(r,len); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
          else if (vpType === 'ring') { m.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),dir); }
          else if (vpType === 'arrow') { m.userData.arrowLen=len; rebuildArrow(m, len, m.userData.shaftwidth||0.1); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
          else if (vpType === 'helix') { rebuildHelixLen(m, len); m.quaternion.setFromUnitVectors(new THREE.Vector3(1,0,0),dir); }
          else { m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); }
        }
      }
    } else if (cmd.action === 'scene') {
      if (cmd.property === 'background') scene.background = toColor(cmd.value);
      if (cmd.property === 'range') cameraSystem.setExplicitRange(cmd.value);
      if (cmd.property === 'center') cameraSystem.setExplicitCenter(...cmd.value);
      if (cmd.property === 'forward') cameraSystem.setForward(...cmd.value);
      if (cmd.property === 'up') cameraSystem.setUp(...cmd.value);
      if (cmd.property === 'fov') cameraSystem.setFov(cmd.value);
      if (cmd.property === 'autoscale') cameraSystem.setAutoscale(cmd.value);
      if (cmd.property === 'camera_pos') cameraSystem.setCameraPos(...cmd.value);
      if (cmd.property === 'camera_axis') cameraSystem.setCameraAxis(...cmd.value);
      if (cmd.property === 'camera_follow') cameraSystem.followObject(cmd.value ? meshes.get(cmd.value) : null);
    } else if (cmd.action === 'trail_update') {
      updateTrail(cmd);
    } else if (cmd.action === 'trail_clear') {
      const t = trails.get(cmd.id);
      if (t) { t.positions.length = 0; t.line.geometry.setAttribute('position', new THREE.Float32BufferAttribute([], 3)); t.line.geometry.computeBoundingSphere(); }
    } else if (cmd.action === 'trail_attach') {
      if (!trails.has(cmd.id) && meshes.has(cmd.id)) createTrail({id:cmd.id, pos: cmd.pos||[0,0,0], color:[1,1,1], trail_color: cmd.trail_color});
    } else if (cmd.action === 'curve_append') {
      const c = curves.get(cmd.id);
      if (c) { c.positions.push(cmd.pos[0], cmd.pos[1], cmd.pos[2]); c.line.geometry.setAttribute('position', new THREE.Float32BufferAttribute(c.positions, 3)); c.line.geometry.computeBoundingSphere(); }
    } else if (cmd.action === 'curve_clear') {
      const c = curves.get(cmd.id);
      if (c) { c.positions.length = 0; c.line.geometry.setAttribute('position', new THREE.Float32BufferAttribute([], 3)); c.line.geometry.computeBoundingSphere(); }
    } else if (cmd.action === 'compound') {
      const group = new THREE.Group();
      for (const subId of (cmd.sub_ids||[])) {
        const subMesh = meshes.get(subId);
        if (subMesh) { subMesh.updateWorldMatrix(true,true);const world=subMesh.matrixWorld.clone();subMesh.removeFromParent();world.decompose(subMesh.position,subMesh.quaternion,subMesh.scale);group.add(subMesh); }

      group.userData={vpType:'compound',boxAxis:cmd.axis||[1,0,0],boxUp:cmd.up||[0,1,0]};
      applyBoxOrientation(group);
      compoundAppearance.init(group);
      compoundAppearance.apply(group,cmd);
      group.visible = cmd.visible !== false;
      scene.add(group);
      meshes.set(cmd.id, group);
      if (cmd.make_trail) createTrail(cmd);
    } else if (cmd.action === 'sound') {
      processSoundCmd(cmd);
    } else if (cmd.action === 'chart') {
      renderChart(cmd);
    }
  }

  // === Pyodide 직접 로드 + 실행 ===
  const progress = document.getElementById('progress');
  const loading = document.getElementById('loading');

  async function run() {
    progress.style.width = '20%';
    const pyodideCdns = [
      'https://cdn.jsdelivr.net/pyodide/v0.27.0/full/',
      'https://unpkg.com/pyodide@0.27.0/',
    ];
    let pyodideIndexUrl = null;
    let lastLoadError = null;
    for (const cdn of pyodideCdns) {
      const pyodideScript = document.createElement('script');
      pyodideScript.src = cdn + 'pyodide.js';
      document.head.appendChild(pyodideScript);
      try {
        await new Promise((resolve, reject) => {
          pyodideScript.onload = resolve;
          pyodideScript.onerror = () => reject(new Error(cdn + 'pyodide.js 로드 실패'));
        });
        pyodideIndexUrl = cdn;
        break;
      } catch (err) {
        lastLoadError = err;
        pyodideScript.remove();
      }
    }
    if (!pyodideIndexUrl) throw lastLoadError || new Error('Pyodide CDN 로드 실패');
    progress.style.width = '50%';

    const pyodide = await loadPyodide({ indexURL: pyodideIndexUrl });

    def __init__(self, x=0, y=0, z=0):

    @property

# 위치는 입력 벡터를 복사하고, 성분 수정 시 같은 벡터에서 갱신합니다.
def _bind_position(owner, value, notify=True):
    if hasattr(owner, '_pos'):
        owner._pos._change_callback = None
    owner._pos = value.clone()
    def changed():
        pos = owner._pos.to_list()
        _add_command({'action':'update','id':owner._id,'pos':pos})
        if getattr(owner, '_make_trail', False):
            _add_command({'action':'trail_update','id':owner._id,'pos':pos})
    owner._pos._change_callback = changed
    if notify: changed()

class _GObject:
    def __init__(self, obj_type, **kwargs):
        self._id = _new_id()
        self._type = obj_type
        self._make_trail = kwargs.pop('make_trail', False)
        self._trail_color = kwargs.pop('trail_color', None)
        _bind_position(self, kwargs.get('pos', vector(0,0,0)), False)
        self._color = kwargs.get('color', color.white)
        self._visible = kwargs.get('visible', True)
        self._opacity = kwargs.get('opacity', 1.0)
        self._emissive = kwargs.get('emissive', False)
        self._velocity = kwargs.get('velocity', vector(0,0,0))
        _add_command({
            "action":"create","id":self._id,"type":obj_type,
            "pos":self._pos.to_list(),"color":self._color.to_list(),
            "visible":self._visible,"opacity":self._opacity,
            "make_trail":self._make_trail,
            "trail_color":self._trail_color.to_list() if self._trail_color else None,
            **{k:v for k,v in kwargs.items() if k not in ('pos','color','visible','opacity','velocity') and isinstance(v,(int,float,bool,str))},
            **{k:v.to_list() for k,v in kwargs.items() if k not in ('pos','color','visible','opacity','velocity') and isinstance(v,vector)},
            **{k:list(v) for k,v in kwargs.items() if k not in ('pos','color','visible','opacity','velocity') and isinstance(v,(list,tuple))},
        })
    @property
    def pos(self): return self._pos
    @pos.setter
    def pos(self, v):
        _bind_position(self, v)
    @property
    def color(self): return self._color
    @color.setter
    def color(self, v):
        self._color = v
        _add_command({"action":"update","id":self._id,"color":v.to_list()})
    @property
    def visible(self): return self._visible
    @visible.setter
    def visible(self, v):
        self._visible = v
        _add_command({"action":"update","id":self._id,"visible":v})
    @property
    def velocity(self): return self._velocity
    @velocity.setter
    def velocity(self, v): self._velocity = v
    @property
    def opacity(self): return self._opacity
    @opacity.setter
    def opacity(self, v):
        self._opacity = v
        _add_command({"action":"update","id":self._id,"opacity":v})
    @property
    def emissive(self): return self._emissive
    @emissive.setter
    def emissive(self, v):
        self._emissive = v
        _add_command({"action":"update","id":self._id,"emissive":v})

    # === v3 공통 메서드 ===
    def _clone_kwargs(self):
        return {
            'pos': self._pos.clone() if isinstance(self._pos, vector) else self._pos,
            'color': self._color.clone() if isinstance(self._color, vector) else self._color,
            'visible': self._visible, 'opacity': self._opacity, 'emissive': self._emissive,
        }
    def clone(self, **kwargs):
        args = self._clone_kwargs(); args.update(kwargs)
        return self.__class__(**args)
    def rotate(self, angle, axis=None, origin=None):
        if axis is None: axis = vector(0,1,0)
        if origin is None: origin = self._pos
        rel = self._pos - origin
        new_rel = rel.rotate(angle, axis=axis)
        self.pos = origin + new_rel
        if hasattr(self, '_axis') and isinstance(self._axis, vector):
            self.axis = self._axis.rotate(angle, axis=axis)
    def clear_trail(self):
        _add_command({"action":"trail_clear","id":self._id})
    def attach_trail(self, color=None, retain=10000):
        self._make_trail = True
        if color is not None: self._trail_color = color
        _add_command({"action":"trail_attach","id":self._id,
                      "trail_color": color.to_list() if isinstance(color, vector) else None,
                      "pos": self._pos.to_list(), "retain": int(retain)})

class compound:
    def __init__(self, objects, **kw):
        self._id = _new_id()
        self._objects = list(objects)
        _send_commands()
        bounds = json.loads(str(_js_compound_bounds(json.dumps([o._id for o in self._objects]))))
        self._center0 = vector(*bounds['center'])
        self._size0 = vector(*bounds['size'])
        _bind_position(self, kw.get('pos', self._center0), False)
        axis = kw.get('axis', vector(1,0,0))
        self._axis = (axis.hat if axis.mag else vector(1,0,0)) * self._size0.x
        self._up = kw.get('up', vector(0,1,0))
        self._set_color(kw.get('color') or color.white)
        self._visible = kw.get('visible', True)
        self._opacity = self._check_unit(kw.get('opacity',1.0),'opacity')
        self._shininess = self._check_unit(kw.get('shininess',0.6),'shininess')
        self._emissive = bool(kw.get('emissive',False))
        self._make_trail = kw.pop('make_trail', False)
        self._trail_color = kw.pop('trail_color', None)
        cmd = {
            "action":"compound","id":self._id,
            "sub_ids":[obj._id for obj in self._objects],
            "center":self._center0.to_list(), "axis":self._axis.to_list(), "up":self._up.to_list(),
            "pos":self._pos.to_list(),
            "color":self._color.to_list() if self._color else None,
            "visible":self._visible,"opacity":self._opacity,
            "make_trail":self._make_trail,
            "trail_color":self._trail_color.to_list() if self._trail_color else None,
        }
        if 'shininess' in kw: cmd['shininess']=self._shininess
        if 'emissive' in kw: cmd['emissive']=bool(kw['emissive'])
        _add_command(cmd)
    @property
    def axis(self): return self._axis
    @axis.setter
    def axis(self,v):
        self._axis=v.clone()
        _add_command({'action':'update','id':self._id,'axis':self._axis.to_list()})
    @property
    def up(self): return self._up
    @up.setter
    def up(self,v):
        self._up=v.clone()
        _add_command({'action':'update','id':self._id,'up':self._up.to_list()})
    def rotate(self,angle,axis=None,origin=None):
        axis=axis if axis is not None else self._axis
        origin=origin if origin is not None else self._pos
        self.pos=origin+(self._pos-origin).rotate(angle,axis=axis)
        self.axis=self._axis.rotate(angle,axis=axis)
        self.up=self._up.rotate(angle,axis=axis)

    @staticmethod
    def _check_unit(v,name):
        import math
        v=float(v)
        if not math.isfinite(v) or not 0<=v<=1: raise ValueError('compound.'+name+' must be between 0 and 1')
        return v
    def _set_color(self,v):
        self._color=vector(v.x,v.y,v.z)
        self._color._change_callback=lambda: _add_command({'action':'update','id':self._id,'color':self._color.to_list()})
    def __getitem__(self, i): return self._objects[i]
    def __len__(self): return len(self._objects)
    @property
    def pos(self): return self._pos
    @pos.setter
    def pos(self, v):
        _bind_position(self, v)
    @property
    def color(self): return self._color
    @color.setter
    def color(self, v):
        self._set_color(v)
        _add_command({"action":"update","id":self._id,"color":self._color.to_list()})
    @property

        _add_command({"action":"update","id":self._id,"visible":v})
    @property
    def opacity(self): return self._opacity
    @opacity.setter
    def opacity(self, v):
        self._opacity = self._check_unit(v,"opacity")
        _add_command({"action":"update","id":self._id,"opacity":self._opacity})


    @property

def _ellipsoid_vector(v):
    return v.clone() if isinstance(v, vector) else vector(*v)

class ellipsoid(box):
    _geometry_type = 'ellipsoid'
    def __init__(self, **kw):
        axis = _ellipsoid_vector(kw.pop('axis', vector(1,0,0)))
        size = kw.pop('size', None)
        if size is None:
            size = vector(kw.pop('length', axis.mag or 1), kw.pop('height',1), kw.pop('width',1))
        else:
            size = _ellipsoid_vector(size)
            for i, name in enumerate(('length','height','width')):
                if name in kw:
                    setattr(size, ('x','y','z')[i], float(kw.pop(name)))
        direction = axis.hat if axis.mag else vector(1,0,0)
        kw['axis'] = direction * size.x
        kw['up'] = _ellipsoid_vector(kw.pop('up', vector(0,1,0)))
        super().__init__(size=size, **kw)
        self._watch_vectors()
    def _watch_vectors(self):
        self._size._change_callback = lambda: setattr(self, 'size', self._size)
        self._axis._change_callback = lambda: setattr(self, 'axis', self._axis)
        self._up._change_callback = lambda: setattr(self, 'up', self._up)
    @property
    def size(self): return self._size
    @size.setter
    def size(self, value):
        self._size = _ellipsoid_vector(value)
        direction = self._axis.hat if self._axis.mag else vector(1,0,0)
        self._axis = direction * self._size.x
        self._watch_vectors()
        _add_command({'action':'update','id':self._id,'size':self._size.to_list(),'axis':self._axis.to_list()})
    @property
    def axis(self): return self._axis
    @axis.setter
    def axis(self, value):
        self._axis = _ellipsoid_vector(value)
        if self._axis.mag: self._size._x = self._axis.mag
        self._watch_vectors()
        _add_command({'action':'update','id':self._id,'axis':self._axis.to_list(),'size':self._size.to_list()})
    @property
    def up(self): return self._up
    @up.setter
    def up(self, value):
        self._up = _ellipsoid_vector(value)
        self._watch_vectors()
        _add_command({'action':'update','id':self._id,'up':self._up.to_list()})
    @property
    def length(self): return self._size.x
    @length.setter
    def length(self, value): self.size = vector(value,self._size.y,self._size.z)
    @property
    def height(self): return self._size.y
    @height.setter
    def height(self, value): self.size = vector(self._size.x,value,self._size.z)
    @property
    def width(self): return self._size.z
    @width.setter
    def width(self, value): self.size = vector(self._size.x,self._size.y,value)
    def _clone_kwargs(self):
        return {**super()._clone_kwargs(), 'size':self._size.clone(), 'axis':self._axis.clone(), 'up':self._up.clone()}

        self._vertices = [v if isinstance(v, vertex) else vertex(pos=v) for v in verts]

class _ExportCamera:
    def __init__(self,owner): self._scene=owner
    @property
    def pos(self):
        return self._scene._read('pos',self._scene._center-self._scene._forward*self._scene._distance())
    @pos.setter
    def pos(self,v):
        axis=self.axis
        self._scene._center=v+axis
        self._scene._send('camera_pos',v.to_list())
    @property
    def axis(self): return self._scene.center-self.pos
    @axis.setter
    def axis(self,v):
        if v.mag==0: raise ValueError('camera.axis must be nonzero')
        self._scene._center=self.pos+v
        self._scene._forward=norm(v)
        self._scene._range=v.mag*math.tan(self._scene._fov/2)
        self._scene._send('camera_axis',v.to_list())
    def follow(self,obj=None): self._scene._send('camera_follow',getattr(obj,'_id',None))
    def rotate(self,angle=0,axis=None,origin=None):
        axis=axis if axis is not None else self._scene.forward
        old_pos,old_axis=self.pos,self.axis
        origin=origin if origin is not None else old_pos
        new_up=self._scene.up.rotate(angle,axis=axis)
        self.pos=origin+(old_pos-origin).rotate(angle,axis=axis)
        self.axis=old_axis.rotate(angle,axis=axis)
        self._scene.up=new_up

class _Scene:
    def __init__(self):
        self._background=vector(0.97,0.98,0.98)

        try:
            value=json.loads(str(_js_camera_state())).get(name)
            if value is not None: return vector(*value) if isinstance(value,list) else value
        except (NameError,TypeError,ValueError): pass
        return fallback
    def _distance(self): return self._range/math.tan(self._fov/2)
    @property
    def background(self): return self._background

    def background(self,v):

    @property

        self._range=v

    @property

        self._fov=v

    @property
    def autoscale(self): return self._read('autoscale',self._autoscale)

# === rate/sleep ===
async def rate(fps, callback=None):
    _send_commands()
    if callback is not None:
        # GlowScript 콜백 형식 — 한 프레임 뒤 콜백을 별도 태스크로 부르고 바로 돌아온다
        async def _later():
            await asyncio.sleep(1.0/fps)
            result = callback()
            if asyncio.iscoroutine(result):
                await result
        asyncio.ensure_future(_later())
        await asyncio.sleep(0)
        return
    await asyncio.sleep(1.0/fps)

async def sleep(seconds):
    _send_commands()
    await asyncio.sleep(seconds)

_KOREAN_NOTE_MAP = {
    '도':'C','레':'D','미':'E','파':'F','솔':'G','라':'A','시':'B',
    '도#':'C#','레#':'D#','파#':'F#','솔#':'G#','라#':'A#',
    '레b':'Db','미b':'Eb','솔b':'Gb','라b':'Ab','시b':'Bb',
}
def _resolve_note_name(name):
    if not name: return name
    for kr, en in _KOREAN_NOTE_MAP.items():
        if name.startswith(kr):
            rest = name[len(kr):]
            if not rest or not rest[0].isdigit(): rest = '4' + rest
            return en + rest
    if len(name)==1 and name[0] in 'ABCDEFG': return name+'4'
    if len(name)==2 and name[0] in 'ABCDEFG' and name[1] in '#b': return name+'4'
    return name

class NamedList(list):
    def __init__(self, items, name_map=None):
        super().__init__(items)
        self._name_map = name_map or {}
    def __getitem__(self, key):
        if isinstance(key, str):
            if key in self._name_map: return super().__getitem__(self._name_map[key])
            raise KeyError(f"'{key}' 이름을 찾을 수 없습니다")
        return super().__getitem__(key)
